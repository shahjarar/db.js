<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Mercer | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .hero {
            text-align: center;
            padding: 2rem;
            max-width: 900px;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 2px 4px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to right, #ffffff, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p.tagline {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            opacity: 0.95;
            margin-bottom: 3rem;
        }

        .get-started-btn {
            display: inline-block;
            padding: 1rem 3rem;
            background: #fff;
            color: #1e3c72;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .get-started-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            background: #f0f4ff;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 4rem;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .feature-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .feature-card p {
            font-size: 0.95rem;
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            .hero p.tagline { font-size: 1.1rem; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Alex Mercer</h1>
        <p class="tagline">Full Stack Web Developer | UI/UX Enthusiast</p>
        <a href="#projects" class="get-started-btn">Get Started</a>

        <div class="features">
            <div class="feature-card">
                <h3>🚀 Modern Stack</h3>
                <p>Built with React, Node.js, and MongoDB for scalable solutions.</p>
            </div>
            <div class="feature-card">
                <h3>🎨 Beautiful Design</h3>
                <p>Clean, responsive interfaces that users love.</p>
            </div>
            <div class="feature-card">
                <h3>⚡ Fast Performance</h3>
                <p>Optimized for speed and seamless user experience.</p>
            </div>
        </div>
    </div>
</body>
</html>
